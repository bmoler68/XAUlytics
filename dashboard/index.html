<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>XAUlytics Dashboard</title>
    <link rel="stylesheet" href="./styles.css?v=20260506" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div class="header-row">
          <div>
            <h1>XAUlytics Precious Metals Dashboard</h1>
            <p id="as-of-label" class="muted">Loading current snapshot...</p>
          </div>
          <div class="toolbar">
            <label class="toolbar-label" for="base-currency-select">Base currency</label>
            <select id="base-currency-select" aria-label="Base currency for spot prices"></select>
          </div>
        </div>
      </header>

      <section id="cards" class="cards" aria-label="Precious metal summary cards"></section>

      <section class="detail">
        <div class="detail-header">
          <h2 id="detail-title">Select a metal</h2>
          <p id="detail-subtitle" class="muted"></p>
        </div>
        <div class="chart-wrap">
          <canvas id="trend-chart" aria-label="Price trend chart"></canvas>
        </div>
        <div class="performance-wrap">
          <h3 id="performance-heading" class="performance-title">Performance</h3>
          <p id="performance-caption" class="muted performance-caption"></p>
          <div class="table-wrap performance-table-wrap">
            <table aria-label="Spot performance by period">
              <thead>
                <tr>
                  <th>Period</th>
                  <th>Return</th>
                </tr>
              </thead>
              <tbody id="performance-tbody"></tbody>
            </table>
          </div>
        </div>
        <div class="table-wrap">
          <table id="history-table">
            <thead>
              <tr>
                <th>Date</th>
                <th>Spot</th>
                <th>Bid</th>
                <th>Ask</th>
                <th>Spread</th>
                <th>Daily Change</th>
                <th>Daily Change %</th>
              </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>
      </section>

      <section class="attribution">
        Powered by
        <a href="https://metalpriceapi.com/" title="Free Precious Metal Rates API">MetalpriceAPI.com</a>
      </section>
    </main>
    <script src="./app.js?v=20260506b"></script>
  </body>
</html>
