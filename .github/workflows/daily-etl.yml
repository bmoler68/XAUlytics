name: Daily ETL

on:
  schedule:
    # 00:10 UTC daily (after MetalpriceAPI prior-day data per their 00:05 GMT note).
    - cron: "10 0 * * *"
  workflow_dispatch:

jobs:
  run-daily-etl:
    runs-on: ubuntu-latest
    env:
      METALPRICEAPI_API_KEY: ${{ secrets.METALPRICEAPI_API_KEY }}
      METALPRICEAPI_BASE_URL: ${{ secrets.METALPRICEAPI_BASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_SCHEMA: xaulytics
      SUPABASE_METAL_PRICES_TABLE: metal_prices_v1
      SUPABASE_ETL_RUNS_TABLE: etl_runs_v1
      SUPABASE_SYMBOLS_TABLE: metalprice_api_symbols_v1
      LOG_LEVEL: INFO
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Sync symbol catalog
        run: xaulytics-etl symbols

      - name: Run daily ETL
        run: xaulytics-etl daily
