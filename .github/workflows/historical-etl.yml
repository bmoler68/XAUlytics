name: Historical ETL (Manual)

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD)"
        required: true
        type: string
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: true
        type: string

jobs:
  run-historical-etl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Validate date inputs
        run: |
          python -c "import datetime as d; d.date.fromisoformat('${{ github.event.inputs.start_date }}'); d.date.fromisoformat('${{ github.event.inputs.end_date }}')"

      - name: Run historical ETL
        env:
          METALPRICEAPI_API_KEY: ${{ secrets.METALPRICEAPI_API_KEY }}
          METALPRICEAPI_BASE_URL: ${{ secrets.METALPRICEAPI_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_SCHEMA: xaulytics
          SUPABASE_METAL_PRICES_TABLE: metal_prices_v1
          SUPABASE_ETL_RUNS_TABLE: etl_runs_v1
          LOG_LEVEL: INFO
        run: |
          xaulytics-etl historical --start-date "${{ github.event.inputs.start_date }}" --end-date "${{ github.event.inputs.end_date }}"
