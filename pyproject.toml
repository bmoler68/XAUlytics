[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xaulytics-etl"
version = "0.1.0"
description = "Daily and historical ETL for MetalpriceAPI data into Supabase."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "requests>=2.32.3",
  "python-dotenv>=1.0.1",
  "supabase>=2.4.6"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0"
]

[project.scripts]
xaulytics-etl = "xaulytics_etl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
